
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editing Team Daily Work Schedule</title>

<style>
:root {
  --blue:#365b86;
  --blue-dark:#28496f;
  --line:#64748b;
  --paper:#fff;
  --ink:#172033;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:24px;
  background:#eef2f6;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

.page {
  max-width:850px;
  margin:auto;
  background:var(--paper);
  padding:28px;
  box-shadow:0 3px 18px #17203318;
}

header {
  text-align:center;
  margin-bottom:18px;
}

h1 {
  margin:0 0 8px;
  color:var(--blue);
  font-size:25px;
  letter-spacing:.3px;
}

.subtitle {
  font-size:14px;
  font-weight:600;
  margin-bottom:14px;
}

.meta {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  font-size:13px;
}

.date-wrap {
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:600;
}

input[type="date"] {
  border:1px solid #9aa8b8;
  border-radius:4px;
  padding:6px;
  font:inherit;
}

.table-wrap {
  width:100%;
}

table {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td {
  border:1px solid var(--line);
  padding:5px 3px;
  vertical-align:middle;
}

th {
  background:var(--blue);
  color:white;
  font-size:10px;
  text-align:center;
  height:34px;
}

td {
  height:32px;
  font-size:10px;
}

td.time {
  font-weight:600;
  white-space:nowrap;
  background:#f4f7fa;
  text-align:center;
}

select {
  width:100%;
  min-width:0;
  border:0;
  background:transparent;
  font:inherit;
  color:inherit;
  padding:5px 1px;
  outline:none;
  cursor:pointer;
}

select:focus {
  background:#fff8d9;
}

.custom-task {
  width:100%;
  border:0;
  outline:none;
  font:inherit;
  padding:4px 2px;
  background:transparent;
}

.notes {
  margin-top:16px;
  border:1.5px solid #334155;
}

.notes-title {
  background:#e8edf3;
  padding:7px 9px;
  font-weight:700;
  font-size:13px;
  border-bottom:1px solid #64748b;
}

.note-line {
  height:32px;
  border-bottom:1px solid #94a3b8;
  padding:5px 9px;
  outline:none;
  font-size:12px;
}

.note-line:last-child {
  border-bottom:0;
}

.note-line:focus {
  background:#fff8d9;
}

.actions {
  display:flex;
  gap:10px;
  justify-content:center;
  margin:20px auto 0;
  flex-wrap:wrap;
}

button {
  border:0;
  border-radius:5px;
  padding:10px 17px;
  color:white;
  background:var(--blue);
  font-weight:700;
  cursor:pointer;
}

button:hover {
  background:var(--blue-dark);
}

button.secondary {
  background:#64748b;
}

.hint {
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:10px;
}

@media print {
  @page {
    size:A4 portrait;
    margin:8mm;
  }

  body {
    padding:0;
    background:white;
  }

  .page {
    max-width:none;
    padding:0;
    box-shadow:none;
  }

  h1 {
    font-size:18px;
  }

  .subtitle {
    font-size:11px;
    margin-bottom:10px;
  }

  .actions, .hint {
    display:none !important;
  }

  th {
    background:var(--blue) !important;
    color:white !important;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
    font-size:8px;
    padding:4px 2px;
    height:27px;
  }

  td {
    height:25px;
    padding:3px 2px;
    font-size:8px;
  }

  td.time {
    font-size:8px;
  }

  select {
    appearance:none;
    -webkit-appearance:none;
    font-size:8px;
    padding:2px 0;
  }

  .notes {
    margin-top:10px;
  }

  .note-line {
    height:25px;
  }

  input[type="date"] {
    border:0;
    padding:0;
    appearance:none;
  }
}

@media (max-width:600px) {
  body { padding:8px; }
  .page { padding:12px; }
  h1 { font-size:18px; }
  .table-wrap { overflow-x:auto; }
  table { min-width:650px; }
}
</style>
</head>

<body>

<div class="page">

<header>
  <h1>SM OPERATION DAILY WORK SCHEDULE</h1>
  <div class="subtitle">
    Working Hours: 10:30 AM - 9:30 PM
  </div>
</header>

<div class="meta">
  <div class="date-wrap">
    <label for="reportDate">REPORT DATE:</label>
    <input id="reportDate" type="date">
  </div>

  <div><strong>TEAM:</strong> DECORATORS</div>
</div>

<div class="table-wrap">

<table aria-label="Daily editing team report">

<colgroup>
  <col style="width:13%">
  <col style="width:29%">
  <col style="width:12%">
  <col style="width:15%">
  <col style="width:17%">
  <col style="width:14%">
</colgroup>

<thead>
<tr>
  <th>TIME</th>
  <th>TASK / ASSIGNED TEAM</th>
  <th>PRIORITY</th>
  <th>STATUS</th>
  <th>CAKE TYPE</th>
  <th>ORDER NO.</th>
</tr>
</thead>

<tbody id="scheduleRows"></tbody>

</table>
</div>

<section class="notes">
  <div class="notes-title">DAILY GOALS / NOTES</div>
  <div class="note-line" contenteditable="true"></div>
  <div class="note-line" contenteditable="true"></div>
  <div class="note-line" contenteditable="true"></div>
</section>

<div class="actions">
  <button type="button" onclick="window.print()">
    PRINT DAILY REPORT
  </button>

  <button type="button" class="secondary" onclick="clearReport()">
    CLEAR REPORT
  </button>
</div>

<div class="hint">
  Select a task, priority, status and cake type from the dropdowns.
  Use Other / Custom Task to enter a task manually.
</div>

</div>

<script>

const times = [];

let hour = 10;
let minute = 30;

while (true) {

  const suffix = hour >= 12 ? "PM" : "AM";

  let displayHour = hour % 12;
  if (displayHour === 0) displayHour = 12;

  times.push(
    `${displayHour}:${String(minute).padStart(2,"0")} ${suffix}`
  );

  if (hour === 21 && minute === 30) break;

  minute += 30;

  if (minute === 60) {
    minute = 0;
    hour++;
  }
}

const taskOptions = [
  "Christal Task",
  "Juliano Task",
  "Altaf Task",
  "Michelle Task",
  "Joan Task",
  "Hensly Task",
  "Cookies Team Task",
  "Figurine Task",
  "Flower Team Task",
  "Other / Custom Task"
];

const priorityOptions = [
  "",
  "High",
  "Medium",
  "Low"
];

const statusOptions = [
  "",
  "Not Started",
  "In Progress",
  "Completed",
  "On Hold"
];

const cakeOptions = [
  "",
  "Frosted Cake",
  "Fondant Cake",
  "Shape Cake"
];

function makeOptions(items) {
  return items.map(item =>
    `<option value="${item}">${item}</option>`
  ).join("");
}

const tbody = document.getElementById("scheduleRows");

times.forEach(time => {

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td class="time">${time}</td>

    <td>
      <select class="task-select"
        aria-label="Task at ${time}"
        onchange="toggleCustomTask(this)">
        <option value=""></option>
        ${makeOptions(taskOptions)}
      </select>

      <input class="custom-task"
        type="text"
        placeholder="Custom task"
        aria-label="Custom task at ${time}"
        style="display:none;">
    </td>

    <td>
      <select aria-label="Priority at ${time}">
        ${makeOptions(priorityOptions)}
      </select>
    </td>

    <td>
      <select aria-label="Status at ${time}">
        ${makeOptions(statusOptions)}
      </select>
    </td>

    <td>
      <select aria-label="Cake type at ${time}">
        ${makeOptions(cakeOptions)}
      </select>
    </td>

    <td contenteditable="true"
      aria-label="Order number at ${time}">
    </td>
  `;

  tbody.appendChild(tr);

});

function toggleCustomTask(select) {

  const input = select.parentElement.querySelector(".custom-task");

  if (select.value === "Other / Custom Task") {
    input.style.display = "block";
    input.focus();
  } else {
    input.style.display = "none";
    input.value = "";
  }

}

const now = new Date();

const localDate = new Date(
  now.getTime() - now.getTimezoneOffset() * 60000
).toISOString().slice(0,10);

document.getElementById("reportDate").value = localDate;

function clearReport() {

  if (!confirm(
    "Clear all tasks, priorities, statuses, cake types, order numbers and notes?"
  )) return;

  document.querySelectorAll("select").forEach(el => {
    el.selectedIndex = 0;
  });

  document.querySelectorAll(".custom-task").forEach(el => {
    el.value = "";
    el.style.display = "none";
  });

  document.querySelectorAll(
    'td[contenteditable="true"], .note-line'
  ).forEach(el => {
    el.textContent = "";
  });

}

</script>

</body>
</html>
